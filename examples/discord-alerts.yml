# VAL Drops alerts for your Discord server.
# Copy this file to .github/workflows/val-drops.yml in your own GitHub repo and add
# your Discord webhook URL as a secret named DISCORD_WEBHOOK_URL.
# Setup: https://github.com/chillaah/val-drops#get-alerts-in-your-discord-server
name: VAL Drops alerts

on:
  schedule:
    - cron: "30 */3 * * *" # every 3 hours
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

jobs:
  alerts:
    uses: chillaah/val-drops/.github/workflows/discord-follow.yml@production
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
