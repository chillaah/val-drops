<!doctype html>
<!-- Source for assets/og.png (1200×630 social preview). Render a 1200×630 screenshot of #og to regenerate it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist"; font-weight: 400 700; src: url(../assets/fonts/geist-latin.woff2) format("woff2"); }
  body { margin: 0; }
  #og {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 76px 84px;
    display: flex; flex-direction: column; background: #09090b; color: #fafafa; font-family: "Geist", sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 650; letter-spacing: -.01em; }
  .brand svg { width: 48px; height: 48px; }
  .brand span { color: #a1a1aa; font-weight: 500; }
  h1 { margin: auto 0 0; font-size: 104px; line-height: 1; font-weight: 650; letter-spacing: -.045em; }
  h1 em { font-style: normal; color: #a1a1aa; }
  p { margin: 28px 0 0; font-size: 30px; color: #a1a1aa; max-width: 920px; line-height: 1.35; }
  .pill { display: inline-flex; align-items: center; gap: 10px; margin-top: 36px; padding: 8px 16px; width: fit-content;
    font-size: 22px; color: #d4d4d8; border: 1px solid #34343a; border-radius: 999px; }
  .pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
</style>
</head>
<body>
<div id="og">
  <div class="brand"><svg viewBox="0 0 32 32"><path fill="#ff4655" d="M0 0h32v22.4L22.4 32H0z"/><path fill="#fff" d="M7 7h4.6L16 19.6 20.4 7H25l-6.6 18h-4.8z"/></svg>VAL <span>DROPS</span></div>
  <h1>Out-of-game <em>rewards</em></h1>
  <p>Every VALORANT drop, Pick'Ems reward, partner promo and code, with what's claimable right now.</p>
  <div class="pill">Refreshed every 6 hours</div>
</div>
</body>
</html>
