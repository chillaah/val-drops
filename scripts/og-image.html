<!doctype html>
<!-- Source for site/assets/og.png (1200×630 social preview). Serve the repo root (python3 -m http.server),
     open /scripts/og-image.html at a 1200×630 viewport and screenshot #og to regenerate it.
     The raw screenshot is ~700KB; shrink it to a 256-colour PNG (~215KB) with:
     ffmpeg -i shot.png -vf "split[a][b];[a]palettegen=stats_mode=full[p];[b][p]paletteuse=dither=sierra2_4a" site/assets/og.png
     Art is real item images from site/img/; no Riot logos or wordmarks, since this is a fan project.
     The name and tagline are sized to stay readable when Reddit shrinks the image to ~240px wide. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist"; font-weight: 400 700; src: url(../site/assets/fonts/geist-latin.woff2) format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 500; src: url(../site/assets/fonts/geist-mono-latin.woff2) format("woff2"); }
  body { margin: 0; }
  #og {
    position: relative; overflow: hidden;
    width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 0 64px 72px;
    /* A dark card with a soft brand glow reads as a distinct tile on both dark and light feeds. */
    background:
      radial-gradient(640px 520px at 92% 40%, rgba(124, 58, 237, .38), transparent 70%),
      radial-gradient(520px 420px at 0% 100%, rgba(255, 70, 85, .16), transparent 70%),
      #0e0b16;
    color: #fafafa; font-family: "Geist", sans-serif;
  }
  #og::after { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 10px; background: linear-gradient(90deg, #ff4655, #a78bfa); }

  .text { position: relative; z-index: 2; width: 590px; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 24px; }
  .brand svg { width: 104px; height: 104px; flex: none; }
  h1 { margin: 0; font-size: 106px; line-height: .9; font-weight: 700; letter-spacing: -.045em; }
  h1 span { display: block; background: linear-gradient(90deg, #ff4655, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; }
  .live { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; margin: 22px 0 26px; padding: 6px 16px 6px 13px; border-radius: 999px;
    font: 600 24px "Geist", sans-serif; color: #6ee7b7; background: rgba(110, 231, 183, .12); border: 1px solid rgba(110, 231, 183, .35); }
  .live::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #6ee7b7; }
  p { margin: auto 0 0; max-width: 520px; font-size: 38px; line-height: 1.18; font-weight: 600; letter-spacing: -.02em; color: #fafafa; }
  p em { font-style: normal; color: #a9a3ba; }
  .titles { display: flex; gap: 12px; margin-top: 30px; }
  .titles span { font: 500 24px "Geist Mono", monospace; padding: 8px 16px; border-radius: 999px;
    background: #1c1729; border: 1px solid #3b3449; color: #e9e5f5; white-space: nowrap; }

  /* Right-hand collage: fanned player cards with sprays and buddies on top. */
  .art { position: absolute; inset: 0; }
  .art img { position: absolute; display: block; }
  .card { width: 214px; height: 511px; object-fit: cover; border-radius: 14px;
    box-shadow: 0 24px 48px -12px rgba(0, 0, 0, .8), 0 0 0 2px rgba(255, 255, 255, .08); }
  .c1 { left: 640px; top: 92px; transform: rotate(-9deg); }
  .c2 { left: 812px; top: 52px; transform: rotate(-1deg); z-index: 1; }
  .c3 { left: 990px; top: 96px; transform: rotate(8deg); }
  .spray { width: 190px; height: 190px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .7)); z-index: 3; }
  .s1 { left: 604px; top: 438px; transform: rotate(-8deg); }
  .s2 { left: 1030px; top: 8px; width: 160px; height: 160px; transform: rotate(10deg); }
  .buddy { width: 150px; height: 150px; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .75)); z-index: 3; }
  .b1 { left: 890px; top: 470px; }
  .b2 { left: 1068px; top: 466px; transform: rotate(6deg); }
</style>
</head>
<body>
<div id="og">
  <div class="art">
    <img class="card c1" src="../site/img/Sakura_Tokyo_Card_Large_600.webp" alt="">
    <img class="card c2" src="../site/img/Glitchpop_Card_Large_600.webp" alt="">
    <img class="card c3" src="../site/img/Horrors_I_ve_Seen_Card_Large_600.webp" alt="">
    <img class="spray s1" src="../site/img/Not_Today_Spray_600.webp" alt="">
    <img class="spray s2" src="../site/img/All_Love_Spray_600.webp" alt="">
    <img class="buddy b1" src="../site/img/Pocket_Sage_Buddy.webp" alt="">
    <img class="buddy b2" src="../site/img/Flyby_Hug_Buddy.webp" alt="">
  </div>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4655"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" transform="translate(16 16) scale(.8) translate(-16 -16)"><path d="M10.5 10.5a7.8 7.8 0 0 0 0 11M21.5 10.5a7.8 7.8 0 0 1 0 11"/><path stroke-opacity=".55" d="M6 6a14.2 14.2 0 0 0 0 20M26 6a14.2 14.2 0 0 1 0 20"/></g><circle cx="16" cy="16" r="3.4" fill="#6ee7b7"/></svg>
      <h1>VAL<span>DROPS</span></h1>
    </div>
    <span class="live">Claimable now</span>
    <p>Every VALORANT drop, Pick'Ems reward, promo and code <em>in one place</em></p>
    <div class="titles"><span>CLUUUTCH</span><span>Aura Farming</span><span>13-0</span></div>
  </div>
</div>
</body>
</html>
