name: Discord test

# Manually posts the newest item (or a chosen one) to the Discord webhook to check the
# setup or to announce an item the scheduled run missed.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post a test message (off = only show which webhook/channel the secret points to)"
        type: boolean
        default: false
      item:
        description: "Item to post as now claimable, by its slug (the ?item= part of its link). Empty = the newest item, posted as new."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Show webhook target
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "::error::DISCORD_WEBHOOK_URL secret is not set"; exit 1; }
          # GET on a webhook URL returns its metadata; print only non-secret fields.
          curl -sf "$DISCORD_WEBHOOK_URL" | node -e '
            let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => {
              const w = JSON.parse(s);
              console.log(`Webhook name: ${w.name}`);
              console.log(`Channel ID:   ${w.channel_id}`);
              console.log(`Server ID:    ${w.guild_id}`);
            });'
      - name: Post chosen item
        if: inputs.post && inputs.item != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ITEM: ${{ inputs.item }}
        run: node scripts/notify-discord.mjs --item "$ITEM" data/items.js
      - name: Post newest item
        if: inputs.post && inputs.item == ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "::error::DISCORD_WEBHOOK_URL secret is not set"; exit 1; }
          # Fake an "old" snapshot without the first (newest) item so exactly one post goes out.
          node -e '
            global.window = {};
            require("./data/items.js");
            const d = window.VAL_DROPS;
            d.items = d.items.slice(1);
            require("fs").writeFileSync(process.argv[1], "window.VAL_DROPS = " + JSON.stringify(d) + ";\n");
          ' "$RUNNER_TEMP/old.js"
          node scripts/notify-discord.mjs "$RUNNER_TEMP/old.js" data/items.js
