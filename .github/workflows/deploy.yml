name: Deploy

# Publishes the production branch to GitHub Pages.
on:
  push:
    branches: [production]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      checked:
        description: "When the wiki was last checked (ISO time). Stamped into the deployed data only."
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html 404.html app.js theme.js styles.css robots.txt sitemap.xml assets data img _site/
      - name: Stamp last checked time
        if: inputs.checked != ''
        env:
          CHECKED: ${{ inputs.checked }}
        run: sed -i -E "s/^ \"generated\": \"[^\"]*\"/ \"generated\": \"$CHECKED\"/" _site/data/items.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
