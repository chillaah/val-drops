name: Update data

# Pulls new items from the VALORANT Wiki straight into production (data-only
# commits), redeploys (every run, to refresh the "last checked" time), then
# merges production back into development.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      approve:
        description: "Publish changes the data check held for review (changed codes, links to new sites). Check them on the wiki first."
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # to find the last successful run

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      checked: ${{ steps.checked.outputs.at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install WebP tools
        run: sudo apt-get update -q && sudo apt-get install -y -q webp
      - name: Record check time
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Items whose claim window opened since then are posted to Discord.
          echo "prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-data.yml --status success -L 1 --json createdAt -q '.[0].createdAt')" >> "$GITHUB_OUTPUT"
      - name: Rebuild data from the VALORANT Wiki
        run: |
          cp data/items.js "$RUNNER_TEMP/items.old.js"
          node scripts/build-data.mjs
          node scripts/prerender.mjs
      - name: Check data before publishing
        # Stops a broken scrape (wiki layout change) or a suspicious wiki edit from going live.
        run: node scripts/check-data.mjs data/items.js "$RUNNER_TEMP/items.old.js" ${{ inputs.approve && '--approve' || '' }}
      - name: Commit to production
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data img index.html
          # Ignore the "generated" timestamp so unchanged data doesn't create commits.
          if git diff --cached --quiet -I '"generated"'; then
            echo "No new items."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update items from VALORANT Wiki"
          git push origin production
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Post new and now-claimable items to Discord
        # Runs every time, since a claim window can open without the data changing,
        # and after the push so the raw.githubusercontent.com image links resolve.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ADMIN_WEBHOOK_URL: ${{ secrets.DISCORD_ADMIN_WEBHOOK_URL }}
          PREV_CHECK: ${{ steps.checked.outputs.prev }}
        run: node scripts/notify-discord.mjs "$RUNNER_TEMP/items.old.js" data/items.js
      - name: Merge production into development
        if: steps.commit.outputs.changed == 'true'
        run: |
          git checkout development
          if git merge --no-edit production; then
            git push origin development
          else
            git merge --abort
            echo "::warning::Could not merge production into development automatically. Merge it by hand."
          fi

  # Deploys on every run, even with no new items, so the site's "last checked" time stays current
  # without a commit every 6 hours.
  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    with:
      checked: ${{ needs.update.outputs.checked }}
    permissions:
      contents: read
      pages: write
      id-token: write
