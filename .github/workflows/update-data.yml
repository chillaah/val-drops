name: Update data

# Pulls new items from the VALORANT Wiki straight into production (data-only
# commits), redeploys, then merges production back into development.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rebuild data from the VALORANT Wiki
        run: |
          cp data/items.js "$RUNNER_TEMP/items.old.js"
          node scripts/build-data.mjs
      - name: Commit to production
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data img
          # Ignore the "generated" timestamp so unchanged data doesn't create commits.
          if git diff --cached --quiet -I '"generated"'; then
            echo "No new items."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update items from VALORANT Wiki"
          git push origin production
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Post new items to Discord
        if: steps.commit.outputs.changed == 'true'
        # Runs after the push so the raw.githubusercontent.com image links resolve.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-discord.mjs "$RUNNER_TEMP/items.old.js" data/items.js
      - name: Merge production into development
        if: steps.commit.outputs.changed == 'true'
        run: |
          git checkout development
          if git merge --no-edit production; then
            git push origin development
          else
            git merge --abort
            echo "::warning::Could not merge production into development automatically. Merge it by hand."
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
