name: CI

# Checks that the scraper still parses the wiki. Doesn't commit anything.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: for f in scripts/*.mjs app.js; do node --check "$f"; done
      - name: Build data (no image download)
        run: |
          cp data/items.js "$RUNNER_TEMP/items.old.js"
          node scripts/build-data.mjs --no-images
          node scripts/prerender.mjs
      - name: Sanity-check output
        run: node scripts/check-data.mjs data/items.js "$RUNNER_TEMP/items.old.js"
      - name: Check site files exist
        run: for f in index.html 404.html app.js styles.css robots.txt sitemap.xml assets/favicon.svg assets/og.png; do test -f "$f" || { echo "::error::Missing $f"; exit 1; }; done
