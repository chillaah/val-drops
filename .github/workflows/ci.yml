name: CI

# Checks that the scraper still parses the wiki. Doesn't commit anything.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: node --check scripts/build-data.mjs && node --check app.js
      - name: Build data (no image download)
        run: node scripts/build-data.mjs --no-images
      - name: Sanity-check output
        run: |
          node -e '
            global.window = {};
            require("./data/items.js");
            const n = window.VAL_DROPS.items.length;
            console.log(n + " items");
            if (n < 200) { console.error("Too few items, the wiki layout may have changed."); process.exit(1); }
          '
